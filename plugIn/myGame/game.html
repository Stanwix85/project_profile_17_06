<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follow the Snitch - Color Pattern Game</title>
  <link rel="stylesheet" href="game.css">
  <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
</head>

<body>
  <h1 id="level-title">Click to Start, then follow the snitch</h1>
  <div class="container">
    <div class="row">
      <div type="button" id="red" class="btn red"></div>
      <div type="button" id="green" class="btn green"></div>
    </div>

    <div class="row">
      <div type="button" id="yellow" class="btn yellow"></div>
      <div type="button" id="blue" class="btn blue"></div>
    </div>
  </div>

  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
    <div class="col-md-4 d-flex align-items-center">
      <span class="mb-3 mb-md-0 text-body-secondary">© 2024 Andrew Stanwix</span>
    </div>

    <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
      <li class="ms-3"><a class="text-body-secondary" href="https://twitter.com" target="_blank" rel="noopener noreferrer"><img src="svg/twitter-x.svg" alt="Twitter/X"></a></li>
      <li class="ms-3"><a class="text-body-secondary" href="https://facebook.com" target="_blank" rel="noopener noreferrer"><img src="svg/facebook.svg" alt="Facebook"></a></li>
      <li class="ms-3"><a class="text-body-secondary" href="https://instagram.com" target="_blank" rel="noopener noreferrer"><img src="svg/instagram.svg" alt="Instagram"></a></li>
    </ul>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="game.js" charset="utf-8"></script>

</body>

</html>
