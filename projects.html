<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Essential Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Andrew Stanwix - Full-Stack Developer</title>
    <meta name="description" content="Explore software development projects by Andrew Stanwix, featuring web apps, Java arcade games, Spring Boot REST services, and cybersecurity tools.">
    <meta name="keywords" content="Andrew Stanwix Projects, Java Projects, Spring Boot, Web Development, Full-Stack, Portfolio, JavaScript, REST API, Annecy, Geneva">
    <meta name="author" content="Andrew Stanwix">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#124c97">
    <link rel="canonical" href="https://andrewstanwix.com/projects.html">

    <!-- Open Graph / Social Sharing (LinkedIn, Facebook) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Andrew Stanwix Portfolio">
    <meta property="og:title" content="Projects | Andrew Stanwix - Full-Stack Developer">
    <meta property="og:description" content="Explore software development projects by Andrew Stanwix, spanning Java, Spring Boot, JavaScript, and full-stack architecture.">
    <meta property="og:url" content="https://andrewstanwix.com/projects.html">
    <meta property="og:image" content="https://andrewstanwix.com/image/andrew_campus2.png">
    <meta property="og:locale" content="en_US">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <header id="site-header"></header>
    <div id="banner" style="margin: 0;">
        <h1>My Projects</h1>
    </div>
    <section class="part" id="projects">
        <div class="projects-section-wrapper">
            <h2 class="subtitle2">Featured Projects</h2>
            <!-- <p class="projects-subtext">Filter projects by technology focus or domain.</p> -->
            
            <!-- Four Category Selector Squares (Tabs) -->
            <div class="project-categories-grid" role="tablist" aria-label="Project Categories">
                <button class="project-category-card active" role="tab" aria-selected="true" data-category="Web Projects" type="button">
                    <span class="cat-icon">🌐</span>
                    <span class="cat-title">Web Projects</span>
                    <span class="cat-count" id="count-web-projects">4</span>
                </button>
                <button class="project-category-card" role="tab" aria-selected="false" data-category="Java" type="button">
                    <span class="cat-icon">☕</span>
                    <span class="cat-title">Java</span>
                    <span class="cat-count" id="count-java">5</span>
                </button>
                <button class="project-category-card" role="tab" aria-selected="false" data-category="Full Stack" type="button">
                    <span class="cat-icon">⚡</span>
                    <span class="cat-title">Full Stack</span>
                    <span class="cat-count" id="count-full-stack">3</span>
                </button>
                <button class="project-category-card" role="tab" aria-selected="false" data-category="Other" type="button">
                    <span class="cat-icon">🛡️</span>
                    <span class="cat-title">Other</span>
                    <span class="cat-count" id="count-other">2</span>
                </button>
            </div>

            <!-- Dynamic Project Cards Grid -->
            <div class="projects-grid" id="projects-grid" role="region" aria-live="polite">
                <!-- Dynamically loaded via loadProjects() from data/projects.json -->
            </div>
        </div>
    </section>

    <footer id="site-footer"></footer>
    <script src="components.js" defer></script>
</body>
</html>
